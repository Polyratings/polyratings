name: Continuous Integration and Deployment
permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:
    branches:
      - master
      - beta
  merge_group:

env:
  NX_BRANCH: ${{ github.event.number || github.ref_name }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: master

      - name: Lint affected packages
        run: npx nx affected --target=lint --parallel

      - name: Build affected packages
        run: npx nx affected --target=build --parallel

      - name: Test affected packages
        run: npx nx affected --target=test --parallel --passWithNoTests

      - name: Nx self-healing CI
        if: always()
        run: npx nx fix-ci

  deploy-prod:
    name: Production Deployment
    needs: [ci]
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/reusable-deploy-workflow.yml
    permissions:
      contents: read
      deployments: write
    with:
      ENVIRONMENT_NAME: prod
      GITHUB_ENVIRONMENT: production
      GITHUB_ENVIRONMENT_URL: https://polyratings.dev
      DEPLOY_SCRIPT: deploy:prod
      PAGES_BRANCH: master
      FRONTEND_BUILD_MODE: master
      PLAYWRIGHT_BASE_URL: https://polyratings.dev
      EXCLUDE_WRITE_TESTS: true
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-beta:
    name: Beta Deployment
    needs: [ci]
    if: github.ref == 'refs/heads/beta'
    uses: ./.github/workflows/reusable-deploy-workflow.yml
    permissions:
      contents: read
      deployments: write
    with:
      ENVIRONMENT_NAME: beta
      GITHUB_ENVIRONMENT: beta
      GITHUB_ENVIRONMENT_URL: https://beta.polyratings.pages.dev
      DEPLOY_SCRIPT: deploy:beta
      PAGES_BRANCH: beta
      FRONTEND_BUILD_MODE: beta
      PLAYWRIGHT_BASE_URL: https://beta.polyratings.pages.dev
      EXCLUDE_WRITE_TESTS: false
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  deploy-dev:
    name: Dev Preview
    needs: [ci]
    # Per-PR Worker preview + Pages branch. Fork PRs have no Cloudflare token and are skipped in the reusable workflow.
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-deploy-workflow.yml
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    with:
      ENVIRONMENT_NAME: dev
      GITHUB_ENVIRONMENT: dev
      WORKER_PUBLISH: versions-upload
      PREVIEW_ALIAS: pr-${{ github.event.number }}
      PAGES_BRANCH: pr-${{ github.event.number }}
      FRONTEND_BUILD_MODE: dev
      CONCURRENCY_GROUP: preview-pr-${{ github.event.number }}
      COMMENT_ON_PR: true
      EXCLUDE_WRITE_TESTS: false
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
