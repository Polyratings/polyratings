name: Deployment Workflow

on:
  workflow_call:
    inputs:
      ENVIRONMENT_NAME:
        description: "prod, beta, or dev"
        required: true
        type: string
      DEPLOY_SCRIPT:
        description: "Root npm script used to deploy workers (deploy:prod, deploy:beta, or deploy:dev)"
        required: true
        type: string
      PAGES_BRANCH:
        description: "Cloudflare Pages branch (master=production, beta=preview alias, PR branch=preview)"
        required: true
        type: string
      FRONTEND_BUILD_MODE:
        description: "Vite/CF_PAGES_BRANCH mode used to select the frontend API target (master, beta, or dev)"
        required: true
        type: string
      PLAYWRIGHT_BASE_URL:
        description: "Stable frontend URL for e2e. Falls back to the Pages deployment URL when omitted."
        required: false
        type: string
      EXCLUDE_WRITE_TESTS:
        description: "Skip Playwright tests tagged @write (required for production)"
        required: false
        type: boolean
        default: false
      CF_ACCOUNT_ID:
        description: "Cloudflare account that owns the Pages project"
        required: false
        type: string
        default: "4b59b59a6058dce1832781075d4fde9d"
      CF_PAGES_PROJECT_NAME:
        description: "Cloudflare Pages project name"
        required: false
        type: string
        default: "polyratings"

    secrets:
      CF_API_TOKEN:
        description: "Cloudflare API token used to deploy workers and Pages"
        required: false

jobs:
  deploy:
    name: Deploy ${{ inputs.ENVIRONMENT_NAME }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: cd-${{ inputs.ENVIRONMENT_NAME }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    env:
      # Nx/Node TS stripping can fail to resolve Playwright config when run via Nx.
      NX_PREFER_NODE_STRIP_TYPES: false

    steps:
      - name: Detect Cloudflare credentials
        id: cf
        run: |
          if [[ -n "${{ secrets.CF_API_TOKEN }}" ]]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            if [[ "${{ inputs.ENVIRONMENT_NAME }}" != "dev" ]]; then
              echo "CF_API_TOKEN is required to deploy ${{ inputs.ENVIRONMENT_NAME }}"
              exit 1
            fi
            echo "No CF_API_TOKEN; skipping outside-contributor deploy and e2e."
          fi

      - uses: actions/checkout@v7
        if: steps.cf.outputs.has_token == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.cf.outputs.has_token == 'true'
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        if: steps.cf.outputs.has_token == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.cf.outputs.has_token == 'true'
        env:
          CF_PAGES_BRANCH: ${{ inputs.FRONTEND_BUILD_MODE }}
        run: NX_CLOUD_DISTRIBUTED_EXECUTION=false npx nx run @polyratings/frontend:build

      - name: Deploy workers
        if: steps.cf.outputs.has_token == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: NX_CLOUD_DISTRIBUTED_EXECUTION=false npm run ${{ inputs.DEPLOY_SCRIPT }}

      - name: Deploy frontend to Cloudflare Pages
        if: steps.cf.outputs.has_token == 'true'
        id: publish-pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ inputs.CF_ACCOUNT_ID }}
          command: pages deploy packages/frontend/dist --project-name=${{ inputs.CF_PAGES_PROJECT_NAME }} --branch=${{ inputs.PAGES_BRANCH }} --commit-dirty=true

      - name: Install Playwright browsers
        if: steps.cf.outputs.has_token == 'true'
        run: npx playwright install chromium --with-deps
        working-directory: packages/e2e

      - name: Run Playwright tests
        if: steps.cf.outputs.has_token == 'true'
        working-directory: packages/e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.PLAYWRIGHT_BASE_URL || steps.publish-pages.outputs.pages-deployment-alias-url || steps.publish-pages.outputs.deployment-url }}
          PLAYWRIGHT_EXCLUDE_WRITE: ${{ inputs.EXCLUDE_WRITE_TESTS }}
          CI: true
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ steps.cf.outputs.has_token == 'true' && !cancelled() }}
        with:
          name: playwright-report-${{ inputs.ENVIRONMENT_NAME }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 30
          if-no-files-found: ignore
